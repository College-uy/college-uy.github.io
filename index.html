<style>
/* Historias a pantalla completa sobre fondo blanco, como la presentación de College:
   Inter, gris medio oscuro para el texto y el turquesa de College para lo que resalta.
   Cada pantalla: foto o video vertical arriba, texto abajo. Una sola paleta clara a propósito. */
:root{
  --turq:#01D1B7;       /* turquesa de College (medido del logo) */
  --turq-ink:#00A893;   /* turquesa un punto más oscuro para texto chico */
  --turq-tint:#E8FAF7;
  --text:#4A4A4A;       /* gris medio oscuro */
  --text-2:#7A7A7A;
  --line:#E4E7E6;
  --paper:#FFFFFF;
  --media-bg:#EEF1F0;
  --font:"Inter","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%;background:var(--paper);color:var(--text)}
body{margin:0;font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
*{box-sizing:border-box}
b,strong{color:var(--turq);font-weight:700}

.app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper)}
.stage{position:relative;width:100%;height:100%;max-width:480px;overflow:hidden;overflow:clip;background:var(--paper);user-select:none;-webkit-user-select:none;touch-action:pan-y}
@media (min-width:560px){ .app{background:var(--media-bg)} .stage{height:min(100%,920px);border-radius:18px;box-shadow:0 30px 70px rgba(0,0,0,.12)} }

/* ---- cabecera ---- */
.head{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;background:var(--paper)}
.bars{display:flex;gap:4px}
.bar{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--turq)}
.bar.done i{width:100%}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font:600 12px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--text);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 11px;cursor:pointer}
.tab[aria-current="true"]{background:var(--turq);border-color:var(--turq);color:#fff}
.tab:focus-visible,.nav:focus-visible,.cta:focus-visible,.cred:focus-visible{outline:2px solid var(--turq);outline-offset:2px}

/* ---- pantallas ---- */
.slide{position:absolute;inset:0;padding:calc(env(safe-area-inset-top,0px) + 74px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column;gap:14px;opacity:0;transition:opacity .35s ease;pointer-events:none;background:var(--paper)}
.slide.on{opacity:1;pointer-events:auto}

.media{position:relative;flex:1 1 auto;min-height:0;max-height:calc((100vw - 32px) * 4 / 3);border-radius:16px;overflow:hidden;background:var(--media-bg)}
@media (min-width:480px){ .media{max-height:597px} }
.media img,.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.slide.on .media img.kb{animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.media .rot{position:absolute;left:12px;bottom:12px;font:700 11px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.38);padding:6px 9px;border-radius:999px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

.copy{flex:none}
.kicker{font:700 12px/1.2 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--turq-ink)}
.title{font:800 clamp(26px,7.6vw,34px)/1.05 var(--font);letter-spacing:-.02em;color:var(--text);margin:6px 0 0;text-wrap:balance}
.title em{font-style:italic;color:var(--turq)}
.text{font:400 15.5px/1.48 var(--font);color:var(--text);margin:8px 0 0}

/* portada (como la tapa de la presentación) */
.t-portada .copy{text-align:center}
.t-portada img.logo{height:30px;display:block;margin:0 auto 14px}
.t-portada .title{font-size:clamp(30px,9vw,40px);text-transform:uppercase;letter-spacing:-.02em}
.t-portada .title em{display:block;font-size:.72em;line-height:1.02}
.t-portada .cities{font:500 14px/1 var(--font);letter-spacing:.06em;margin-top:12px;color:var(--text)}
.t-portada .cities i{color:var(--turq);font-style:normal;font-weight:800;padding:0 4px}
.t-portada .media{max-height:56%}
/* reel a pantalla completa (primera pantalla): el video ocupa todo y la cabecera va encima */
.slide.t-reel{padding:0}
.t-reel .media{max-height:none;border-radius:0}
.stage.sobre-video .head{background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,0))}
.stage.sobre-video .bar{background:rgba(255,255,255,.35)}
.stage.sobre-video .bar i{background:#fff}
.stage.sobre-video .tab{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.45);color:#fff}
.stage.sobre-video .tab[aria-current="true"]{background:var(--turq);border-color:var(--turq)}
.reel-pie{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:40px 16px calc(env(safe-area-inset-bottom,0px) + 18px);background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.45));pointer-events:none}
.reel-pie .hint{margin:0;color:#fff;text-align:left}
.reel-pie .hint span{color:#fff}
.sonido{position:relative;flex:none;pointer-events:auto;font:700 11px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.45);border:0;padding:8px 11px;border-radius:999px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sonido:focus-visible{outline:2px solid var(--turq);outline-offset:2px}
.hint{text-align:center;font:600 11.5px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--text-2);margin-top:12px}
.hint span{display:inline-block;animation:nudge 1.6s ease-in-out infinite;color:var(--turq)}
@keyframes nudge{50%{transform:translateX(6px)}}

/* ruta */
.legs{list-style:none;margin:16px 0 0;padding:0;position:relative}
.legs::before{content:"";position:absolute;left:25px;top:22px;bottom:22px;border-left:2px dashed var(--line)}
.legs li{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;padding:8px 0;position:relative}
.legs .code{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--font);letter-spacing:.04em;background:var(--paper);border:2px solid var(--line);color:var(--text-2);position:relative}
.legs .city .code{border-color:var(--turq);color:var(--turq);background:var(--turq-tint)}
.legs .nm{font:800 19px/1.1 var(--font);color:var(--text);display:block}
.legs .ds{font:400 14px/1.3 var(--font);color:var(--text-2)}
.legs button{all:unset;cursor:pointer;display:contents}

/* paneles de texto */
.panel .copy{flex:1;min-height:0;overflow:hidden}
.agenda{margin-top:16px;display:grid;gap:10px}
.dia{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.dia h4{margin:0;font:italic 800 18px/1 var(--font);color:var(--turq)}
.dia p{margin:7px 0 0;font:400 14.5px/1.4 var(--font);color:var(--text);display:grid;grid-template-columns:64px 1fr;gap:6px}
.dia p span{font:700 11px/1.9 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.equipo{margin-top:16px;display:grid;gap:14px}
.persona{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center}
.persona img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid var(--turq);background:var(--media-bg)}
.persona small{font:700 11px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--turq-ink)}
.persona .nm{display:block;font:800 17px/1.2 var(--font);color:var(--text);margin-top:4px}
.persona span{display:block;font:400 14px/1.4 var(--font);color:var(--text-2);margin-top:2px}

/* grillas de fotos verticales */
.grid{flex:1 1 auto;min-height:0;display:grid;gap:8px}
.grid.c3{grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr}
.grid.c2{grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr}
.grid figure{margin:0;position:relative;border-radius:12px;overflow:hidden;background:var(--media-bg);min-height:0}
.grid img,.grid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grid figcaption{position:absolute;left:0;right:0;bottom:0;padding:24px 8px 8px;font:700 12.5px/1.15 var(--font);color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.62))}
.grid figcaption span{display:block;font-weight:400;font-size:11px;opacity:.9;margin-top:2px}

/* cierre */
.t-cierre .copy{flex:1;display:flex;flex-direction:column}
.volver{all:unset;cursor:pointer;align-self:flex-start;font:600 13px/1 var(--font);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:9px 13px;margin-bottom:16px}
.volver:focus-visible{outline:2px solid var(--turq);outline-offset:2px}
.ctas{display:grid;gap:10px;margin-top:22px;position:relative;z-index:4}
.cta{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;color:#fff;background:var(--turq);border-radius:14px;padding:16px;font:700 16px/1.1 var(--font);border:0;cursor:pointer;text-align:left;width:100%}
.cta.alt{background:var(--paper);color:var(--text);border:1px solid var(--line)}
.cta small{font:500 12.5px/1 var(--font);opacity:.9}
.cta[aria-disabled="true"]{opacity:.55;cursor:default}
.t-cierre .logo{height:26px;margin-top:auto;align-self:center;opacity:.9}
.cred{all:unset;cursor:pointer;font:500 11.5px/1.3 var(--font);color:var(--text-2);text-decoration:underline;text-underline-offset:3px;align-self:center;margin-top:12px}
.creditos{position:absolute;inset:0;z-index:8;background:var(--paper);padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 20px;overflow:auto;font:400 12px/1.45 var(--font);color:var(--text-2)}
.creditos h3{font:800 18px/1.2 var(--font);color:var(--text);margin:0 0 10px}
.creditos li{margin-bottom:6px}
.creditos a{color:var(--turq-ink)}

/* zonas de toque (debajo de los botones de cada pantalla) */
.nav{position:absolute;top:74px;bottom:0;z-index:3;background:transparent;border:0;padding:0;cursor:pointer}
.nav.prev{left:0;width:30%}
.nav.next{right:0;width:70%}

.pausa{position:absolute;z-index:6;left:50%;top:40%;transform:translate(-50%,-50%);font:700 12px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.45);padding:9px 13px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.stage.paused .pausa{opacity:1}

@media (prefers-reduced-motion:reduce){
  .slide.on .media img.kb{animation:none}
  .slide{transition:none}
  .hint span{animation:none}
}
</style>

</head>

    <button class="nav next" id="next" aria-label="Siguiente"></button>
    <div class="head">
      <div class="bars" id="bars"></div>
      <nav class="tabs" id="tabs" aria-label="Ciudades"></nav>

    <div class="pausa">En pausa</div>
    <div class="creditos" id="creditos" hidden></div>
  </main>
</div>

function media(s, extra = ""){
  if (s.video && HAY_VIDEO.has(s.video)) return `<div class="media">
      <video muted playsinline ${s.sigue_video ? "" : "loop"} preload="none" poster="${FOTO(s.video)}" src="${VIDEO(s.video)}"></video>${extra}</div>`;
  return `<div class="media"><img class="kb" src="${FOTO(s.foto)}" alt="">${extra}</div>`;
}

      </div>`;
    case "grid": {
      const tiles = s.items.map(([f, t, d, v]) => `<figure>${v && HAY_VIDEO.has(v) ? `<video muted playsinline loop preload="none" poster="${FOTO(v)}" src="${VIDEO(v)}"></video>` : `<img src="${FOTO(f)}" alt="" loading="lazy">`}<figcaption>${t}${d ? `<span>${d}</span>` : ""}</figcaption></figure>`).join("");
      return `
      <div class="copy">
        <div class="kicker">${s.kicker}</div>
        <h2 class="title">${s.title}</h2>
        ${s.text ? `<p class="text">${s.text}</p>` : ""}
      </div>
      <div class="grid c${s.c}">${tiles}</div>`;
    }
    case "cierre": {
      return `
      <div class="copy">
        <button class="volver" type="button" data-back>← Volver</button>
        <div class="kicker">Tu lugar</div>
        <h2 class="title">¿Te sumás <em>al viaje?</em></h2>
        <p class="text">Inscribite y te contamos <b>fechas, cupos y forma de pago</b>.</p>
        <div class="ctas">
          <a class="cta" href="${CONTACTO.inscripcion}" target="_blank" rel="noopener">Quiero mi lugar <small>Inscripción →</small></a>
          <a class="cta alt" href="https://www.instagram.com/${CONTACTO.instagram}/" target="_blank" rel="noopener">Seguinos <small>@${CONTACTO.instagram} →</small></a>
          <button class="cta alt" type="button" data-go="inicio">Ver el viaje de nuevo <small>↺</small></button>
        </div>
        <img class="logo" src="img/logo-college.png" alt="College">
        ${CREDITOS.length ? `<button class="cred" type="button" data-cred>Créditos de fotos y videos</button>` : ""}
      </div>`;
    }
    default: return `
      ${media(s, rot(s))}
      <div class="copy">
        <div class="kicker">${s.kicker}</div>
        <h2 class="title">${s.title}</h2>
        <p class="text">${s.text}</p>
      </div>`;
  }
}

// ---- Motor de historias ----
CAPITULOS.forEach(c => { c.slides = c.slides.filter(s => !s.solo_video || HAY_VIDEO.has(s.video)); });
const FLAT = [];
CAPITULOS.forEach((c, ci) => c.slides.forEach((s, si) => FLAT.push({ ...s, ci, si })));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $slides = document.getElementById("slides"), $bars = document.getElementById("bars"),
      $tabs = document.getElementById("tabs"), stage = document.getElementById("stage");

FLAT.forEach(s => {
  const el = document.createElement("section");
  el.className = `slide t-${s.tipo || "foto"} ${["agenda","equipo","ruta","cierre"].includes(s.tipo) ? "panel" : ""}`;
  el.setAttribute("aria-hidden", "true");
  $slides.appendChild(el);
});
CAPITULOS.forEach((c, ci) => {
  const b = document.createElement("button");
  b.className = "tab"; b.textContent = c.tab; b.type = "button";
  b.addEventListener("click", e => { e.stopPropagation(); go(FLAT.findIndex(s => s.ci === ci)); });
  $tabs.appendChild(b);
});

let cur = -1, t0 = 0, elapsed = 0, paused = false;
const rendered = new Set();
function ensure(i){
  if (i < 0 || i >= FLAT.length || rendered.has(i)) return;
  $slides.children[i].innerHTML = render(FLAT[i]);
  rendered.add(i);
}
const dur = s => s.dur ?? 6500;

function go(i){
  i = Math.max(0, Math.min(FLAT.length - 1, i));
  const prev = $slides.children[cur];
  if (prev){
    prev.classList.remove("on"); prev.setAttribute("aria-hidden", "true");
    prev.querySelectorAll("video").forEach(v => v.pause());
  }
  cur = i; ensure(i); ensure(i + 1); ensure(i + 2);
  const el = $slides.children[i];
  el.classList.add("on"); el.setAttribute("aria-hidden", "false");
  el.querySelectorAll("img.kb").forEach(im => { im.style.animation = "none"; void im.offsetWidth; im.style.animation = ""; });
  el.querySelectorAll("video").forEach(v => { v.currentTime = 0; v.play().catch(() => {}); });
  const s = FLAT[i], cap = CAPITULOS[s.ci];
  $bars.innerHTML = cap.slides.map((_, k) => `<div class="bar ${k < s.si ? "done" : ""}"><i></i></div>`).join("");
  [...$tabs.children].forEach((b, k) => b.setAttribute("aria-current", k === s.ci ? "true" : "false"));
  stage.classList.toggle("sobre-video", s.tipo === "reel");
  // Centrar la pestaña moviendo solo la tira de pestañas (scrollIntoView corría toda la pantalla).
  const tab = $tabs.children[s.ci];
  $tabs.scrollTo({ left: tab.offsetLeft - ($tabs.clientWidth - tab.offsetWidth) / 2, behavior: reduce ? "auto" : "smooth" });
  elapsed = 0; t0 = performance.now();
  // En el cierre, los botones reciben el toque y no las zonas de avance.
  const ultimo = s.tipo === "cierre";
  document.getElementById("prev").hidden = ultimo;
  document.getElementById("next").hidden = ultimo;
}

function tick(now){
  const s = FLAT[cur], d = dur(s), bar = $bars.children[s.si]?.firstElementChild;
  if (d === 0){ if (bar) bar.style.width = "100%"; }
  else if (!paused){
    // Si la pantalla sigue a su video, la barra avanza con el video y pasa al terminar.
    // Si el video falla, vuelve al tiempo fijo de la pantalla.
    const v = s.sigue_video && $slides.children[cur].querySelector("video");
    const sigue = v && !v.error;
    const p = sigue ? (v.duration ? Math.min(1, v.currentTime / v.duration) : 0) : Math.min(1, (elapsed + now - t0) / d);
    if (bar) bar.style.width = (p * 100) + "%";
    if (p >= 1 && cur < FLAT.length - 1) go(cur + 1);
  }
  requestAnimationFrame(tick);
}
function pause(v){
  if (v === paused) return;
  if (v) elapsed += performance.now() - t0; else t0 = performance.now();
  paused = v; stage.classList.toggle("paused", v && dur(FLAT[cur]) > 0);
  $slides.children[cur].querySelectorAll("video").forEach(x => v ? x.pause() : x.play().catch(() => {}));
}

// Tocar avanza o vuelve; mantener apretado pausa; deslizar cambia de ciudad.
let held = false, sx = 0, sy = 0, holdTimer = 0;
function down(e){ held = false; sx = e.clientX; sy = e.clientY; holdTimer = setTimeout(() => { held = true; pause(true); }, 260); }
function up(dir, e){
  clearTimeout(holdTimer);
  if (held){ pause(false); return; }
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
    if (FLAT[cur].tipo === "reel"){ go(cur + (dx < 0 ? 1 : -1)); return; }
    const ci = FLAT[cur].ci + (dx < 0 ? 1 : -1);
    if (ci >= 0 && ci < CAPITULOS.length) go(FLAT.findIndex(s => s.ci === ci));
    else if (ci < 0) go(0);  // desde el Inicio, deslizar atrás vuelve al reel
    return;
  }
  go(cur + dir);
}
[["prev", -1], ["next", 1]].forEach(([id, dir]) => {
  const el = document.getElementById(id);
  el.addEventListener("pointerdown", down);
  el.addEventListener("pointerup", e => up(dir, e));
  el.addEventListener("pointercancel", () => { clearTimeout(holdTimer); pause(false); });
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); go(cur + dir); } });
});

const $cred = document.getElementById("creditos");
$slides.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g){ e.stopPropagation(); go(FLAT.findIndex(s => CAPITULOS[s.ci].id === g.dataset.go)); return; }
  const son = e.target.closest("[data-sonido]");
  if (son){
    e.stopPropagation();
    const v = son.closest(".media").querySelector("video");
    v.muted = !v.muted; v.play().catch(() => {});
    son.textContent = v.muted ? "Activar sonido" : "Silenciar";
    return;
  }
  if (e.target.closest("[data-back]")){ e.stopPropagation(); go(cur - 1); return; }
  if (e.target.closest("[data-cred]")){
    $cred.innerHTML = `<h3>Créditos</h3><ul>${CREDITOS.map(c => `<li>${c.titulo} · ${c.autor} · ${c.licencia} · <a href="${c.url_fuente}" target="_blank" rel="noopener">fuente</a></li>`).join("")}</ul>
      <p>Fotos de los centros y del congreso: College.</p><button class="cta alt" type="button" id="cerrar-cred">Cerrar</button>`;
    $cred.hidden = false;
  }
});
$cred.addEventListener("click", e => { if (e.target.id === "cerrar-cred") $cred.hidden = true; });
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(cur + 1);
  else if (e.key === "ArrowLeft") go(cur - 1);
  else if (e.key === " " && e.target === document.body){ e.preventDefault(); pause(!paused); }
});
let csx = 0;
$slides.addEventListener("pointerdown", e => { csx = e.clientX; });
$slides.addEventListener("pointerup", e => { if (FLAT[cur].tipo === "cierre" && e.clientX - csx > 60) go(cur - 1); });
document.addEventListener("visibilitychange", () => pause(document.hidden));

let inicio = 0;
const hash = location.hash.slice(1);
if (hash){ const k = FLAT.findIndex(s => CAPITULOS[s.ci].id === hash); if (k >= 0) inicio = k; }
go(inicio);
requestAnimationFrame(tick);
</script>

</body>
</html>
