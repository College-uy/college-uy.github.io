<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Capacite-se e divirta-se ao mesmo tempo · College</title>
<meta name="description" content="Congresso, visitas técnicas a estádios e centros de alto rendimento, e dias inesquecíveis com a sua turma.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="Capacite-se e divirta-se ao mesmo tempo">
<meta property="og:description" content="Congresso, visitas técnicas a estádios e centros de alto rendimento, e dias inesquecíveis com a sua turma.">
<meta property="og:image" content="https://college-uy.github.io/br/media/divirta-se-h.jpg">
<meta property="og:url" content="https://college-uy.github.io/br/divirta-se/">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,700;14..32,800&display=swap" rel="stylesheet">
<style>
/* Landing de una pantalla: el video de fondo, la frase gancho y un solo botón. Inter y el turquesa
   de College, como la página del programa. */
:root{--turq:#01D1B7;--font:"Inter","Helvetica Neue",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff}
body{font-family:var(--font);-webkit-font-smoothing:antialiased}
.fondo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000 center/cover no-repeat}
.velo{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,.1) 48%,rgba(0,0,0,.78) 100%)}
main{position:relative;min-height:100svh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 26px) 22px calc(env(safe-area-inset-bottom,0px) + 30px)}
.logo{height:26px;width:auto;align-self:center}
.copy{margin-top:auto;max-width:760px}
.kicker{display:inline-block;font:700 clamp(10px,2.7vw,11.5px)/1.35 var(--font);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:8px 11px;border-radius:999px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
h1{font:800 clamp(40px,11.5vw,92px)/.98 var(--font);letter-spacing:-.035em;margin:16px 0 0;text-wrap:balance;text-shadow:0 2px 24px rgba(0,0,0,.25)}
h1 em{font-style:normal;color:var(--turq)}
.bajada{font:500 clamp(16px,4.3vw,20px)/1.4 var(--font);color:rgba(255,255,255,.92);margin:14px 0 0;max-width:560px;text-wrap:pretty}
.cta{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:26px;width:100%;max-width:420px;padding:19px 22px;border-radius:16px;background:var(--turq);color:#04211D;text-decoration:none;font:800 18px/1 var(--font);box-shadow:0 12px 34px rgba(1,209,183,.35);transition:transform .15s ease}
.cta:hover{transform:translateY(-1px)}
.cta:active{transform:scale(.98)}
.cta span{transition:transform .2s ease}
.cta:hover span{transform:translateX(4px)}
.mas{display:inline-block;margin-top:16px;color:rgba(255,255,255,.85);font:500 14px/1.2 var(--font);text-decoration:underline;text-underline-offset:4px}
.cta:focus-visible,.mas:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media (min-width:820px){
  main{padding:40px 64px 64px}
  .logo{height:30px;align-self:flex-start}
}
@media (prefers-reduced-motion:reduce){.cta,.cta span{transition:none}}
</style>
</head>
<body>
<video class="fondo" id="fondo" muted playsinline loop autoplay preload="auto" aria-hidden="true"></video>
<div class="velo"></div>
<main>
  <img class="logo" src="../img/logo-college-blanco.png" alt="College">
  <div class="copy">
    <div class="kicker">Educação Física · Nutrição · Fisioterapia</div>
    <h1>Capacite-se e <em>divirta-se</em> ao mesmo tempo</h1>
    <p class="bajada">Congresso, visitas técnicas a estádios e centros de alto rendimento, e dias inesquecíveis com a sua turma.</p>
    <a class="cta" href="https://www.cognitoforms.com/CollegeUy/Inscripci%C3%B3nViajeEuropaSeptiembre2027" target="_blank" rel="noopener">Quero me inscrever <span aria-hidden="true">→</span></a>
    <a class="mas" href="../">Ver o programa completo</a>
  </div>
</main>
<script>
// Video vertical en el celular y horizontal en la computadora; cambia si se gira la pantalla.
const v = document.getElementById("fondo"), base = "../media/divirta-se";
const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
let actual = "";
function elegir(){
  const o = innerHeight > innerWidth ? "v" : "h";
  if (o === actual) return;
  actual = o;
  v.poster = `${base}-${o}.jpg`;
  if (quieto){ v.removeAttribute("autoplay"); v.style.backgroundImage = `url(${base}-${o}.jpg)`; return; }
  v.src = `${base}-${o}.mp4`;
  v.play().catch(() => {});
}
elegir();
addEventListener("resize", elegir);
</script>
</body>
</html>
